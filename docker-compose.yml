services:
  itworks:
    build: .
    image: itworks:local
    restart: unless-stopped
    volumes:
      - itworks-data:/data
    environment:
      ITWORKS_TRUST_PROXY: "1"
      ITWORKS_BASE_URL: https://itworks.dev
    networks:
      - dmz-infrastructure_dmz-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dmz-infrastructure_dmz-public"
      - "traefik.http.services.itworks.loadbalancer.server.port=8080"

      # Public router: everything on itworks.dev.
      - "traefik.http.routers.itworks.rule=Host(`itworks.dev`)"
      - "traefik.http.routers.itworks.entrypoints=websecure"
      - "traefik.http.routers.itworks.tls.certresolver=letsencrypt"
      - "traefik.http.routers.itworks.middlewares=itworks-secheaders"
      - "traefik.http.routers.itworks.priority=1"

      # Admin router: itworks.dev/admin only, matched ahead of the public
      # router, gated by the Authentik forward-auth middleware (defense in
      # depth on top of the app's own X-Authentik-Username check).
      - "traefik.http.routers.itworks-admin.rule=Host(`itworks.dev`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.itworks-admin.entrypoints=websecure"
      - "traefik.http.routers.itworks-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.itworks-admin.middlewares=authentik-auth@file,itworks-secheaders"
      - "traefik.http.routers.itworks-admin.priority=10"

      # Security headers, same pattern as /opt/wx-portal. The app itself also
      # sets CSP, X-Content-Type-Options, Referrer-Policy and X-Frame-Options
      # on every response per docs/SPEC.md; this adds HSTS and is defense in
      # depth for the rest.
      - "traefik.http.middlewares.itworks-secheaders.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.itworks-secheaders.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.itworks-secheaders.headers.frameDeny=true"
      - "traefik.http.middlewares.itworks-secheaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.itworks-secheaders.headers.referrerPolicy=strict-origin-when-cross-origin"

networks:
  dmz-infrastructure_dmz-public:
    external: true

volumes:
  itworks-data:
