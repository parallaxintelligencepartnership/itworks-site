{{template "head" .Title}}
<main id="main">

<section class="wall wall-page bleed" aria-labelledby="wall-h">
<div class="wall-head">
<div>
<h1 class="h-xl" id="wall-h">The wall</h1>
<p class="lede">Same columns for everyone.</p>
</div>
<div class="filter" role="group" aria-label="Show">
<span class="chiplab" aria-hidden="true">Show</span>
<input type="radio" id="f-all" name="wallfilter" checked>
<label for="f-all">all</label>
<input type="radio" id="f-current" name="wallfilter">
<label for="f-current">current</label>
<input type="radio" id="f-stale" name="wallfilter">
<label for="f-stale">stale</label>
<input type="radio" id="f-crit" name="wallfilter">
<label for="f-crit">critical</label>
</div>
</div>

{{if .Entries}}
<div class="ledger">
{{template "colhead" .}}
{{range .Entries}}{{template "ledgerrow" .}}
{{end}}
</div>
{{else}}
<p class="empty">Nothing on the wall yet. Run a closeout and take the first line.</p>
{{end}}

</section>
</main>
{{template "footer" .}}
